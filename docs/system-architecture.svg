  <!-- status box -->
  <path class="ink fill-red" d="M610 760 C610 744 626 736 648 737 L900 738 C922 739 936 751 934 770 L933 910 C932 930 916 940 892 938 L646 936 C624 936 610 922 611 902 Z" />
  <text class="heading" x="640" y="795">Job status lifecycle</text>
  <text class="text" x="640" y="832">queued -> processing</text>
  <text class="text" x="640" y="860">processing -> completed</text>
  <text class="text" x="640" y="888">processing -> failed retry</text>
  <text class="text" x="640" y="916">max attempts -> dead_lettered</text>

  <path class="arrow" d="M760 706 C735 728 705 742 670 760" />
