<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Track Lab Architecture Whiteboard</title>
  <desc id="desc">Whiteboard-style architecture diagram for Track Lab showing client routes, API, async SQLite queue, worker, analysis and remix AI flows, providers, stores, and external services.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5,1.5 L10.5,6.5 L1.5,11.5" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5,1.5 L10.5,6.5 L1.5,11.5" fill="none" stroke="#2e6bc6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-purple" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5,1.5 L10.5,6.5 L1.5,11.5" fill="none" stroke="#7b4bb4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      .bg { fill: #fbfbf6; }
      .ink { stroke: #1f1f1f; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke-width: 2; }
      .blue { stroke: #2e6bc6; }
      .green { stroke: #2b8b67; }
      .purple { stroke: #7b4bb4; }
      .brown { stroke: #8a5b42; }
      .fill-blue { fill: #eef5ff; }
      .fill-green { fill: #eefbf5; }
      .fill-purple { fill: #f7f0ff; }
      .fill-yellow { fill: #fff8df; }
      .fill-red { fill: #fff1ef; }
      .fill-white { fill: #fbfbf6; }
      .title { fill: #2e6bc6; font: 700 34px "Comic Sans MS", "Marker Felt", "Segoe Print", cursive; }
      .heading { fill: #1f1f1f; font: 700 21px "Comic Sans MS", "Marker Felt", "Segoe Print", cursive; }
      .text { fill: #1f1f1f; font: 500 18px "Comic Sans MS", "Marker Felt", "Segoe Print", cursive; }
      .small { fill: #1f1f1f; font: 500 15px "Comic Sans MS", "Marker Felt", "Segoe Print", cursive; }
      .tiny { fill: #1f1f1f; font: 500 13px "Comic Sans MS", "Marker Felt", "Segoe Print", cursive; }
      .blue-text { fill: #2e6bc6; }
      .green-text { fill: #2b8b67; }
      .purple-text { fill: #7b4bb4; }
      .arrow { stroke: #1f1f1f; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2e6bc6; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .arrow-purple { stroke: #7b4bb4; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#arrow-purple); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1100" />
  <text class="title" x="770" y="54">Track Lab</text>

  <!-- left notes -->
  <text class="heading" x="45" y="130">Requirements:</text>
  <text class="text" x="45" y="162">1. Analyze or enrich a track</text>
  <text class="text" x="45" y="190">2. Search remixes by title/artist or Spotify URL</text>
  <text class="text" x="45" y="218">3. Run slow work asynchronously</text>
  <text class="text" x="45" y="246">4. Show notifications + review queue</text>
  <text class="text" x="45" y="274">5. Save only after user review</text>

  <text class="heading" x="45" y="332">Non-functional:</text>
  <text class="text" x="45" y="364">1. Cheap/free single-user runtime</text>
  <text class="text" x="45" y="392">2. Recoverable failures</text>
  <text class="text" x="45" y="420">3. Traceable provider + AI execution</text>
  <text class="text" x="45" y="448">4. Shared API typing between web/backend</text>

  <text class="heading" x="45" y="520">Main API:</text>
  <text class="text" x="45" y="552">POST /agent - enqueue analyze/enrich</text>
  <text class="text" x="45" y="580">POST /remix-search - enqueue remix search</text>
  <text class="text" x="45" y="608">GET /track-analysis/jobs</text>
  <text class="text" x="45" y="636">POST /track-analysis/jobs/:id/resolve</text>
  <text class="text" x="45" y="664">GET/POST /results</text>
  <text class="text" x="45" y="692">GET/POST /remix-search/saved</text>

  <!-- client -->
  <ellipse class="ink fill-white" cx="470" cy="310" rx="70" ry="58" />
  <text class="heading" x="424" y="318">Client</text>
  <text class="small" x="392" y="386">React + React Query</text>
  <text class="small" x="400" y="408">TanStack tables</text>

  <!-- API services -->
  <path class="ink fill-white" d="M700 108 C698 100 712 94 728 94 L900 96 C918 96 929 104 929 120 L930 174 C928 190 914 198 895 197 L724 195 C707 196 697 187 698 172 Z" />
  <text class="heading" x="727" y="138">Express API</text>
  <text class="small" x="723" y="166">thin routes + api-types</text>

  <path class="ink fill-white" d="M682 262 C682 248 697 240 714 241 L920 243 C939 243 950 252 950 268 L949 345 C948 363 934 370 916 369 L710 367 C690 367 680 356 681 340 Z" />
  <text class="heading" x="710" y="295">Track Analysis</text>
  <text class="heading" x="720" y="325">Orchestrator</text>
  <text class="small" x="704" y="350">validates + enqueues jobs</text>

  <path class="ink fill-white" d="M678 445 C679 431 694 424 713 424 L924 424 C941 423 952 435 952 451 L952 524 C951 542 939 551 917 550 L710 548 C691 548 679 536 679 520 Z" />
  <text class="heading" x="707" y="479">Track Analysis</text>
  <text class="heading" x="747" y="509">Worker</text>
  <text class="small" x="708" y="534">claims 1 job at a time</text>

  <!-- queue -->
  <path class="ink green fill-green" d="M760 630 C750 616 763 602 783 601 L904 601 C926 602 938 616 929 631 L929 678 C938 694 925 706 904 706 L783 706 C762 706 750 692 760 678 Z" />
  <text class="heading green-text" x="787" y="658">SQLite Job Queue</text>
  <text class="small green-text" x="796" y="684">track_analysis_jobs</text>

  <!-- datastore cylinder -->
  <path class="ink brown fill-yellow" d="M1040 260 C1040 235 1112 215 1198 217 C1285 219 1355 239 1355 264 L1355 462 C1355 488 1285 509 1198 508 C1111 507 1040 486 1040 460 Z" />
  <path class="ink brown" d="M1040 262 C1040 288 1110 309 1198 310 C1286 311 1355 290 1355 264" />
  <text class="heading brown" x="1135" y="352">SQLite</text>
  <text class="small" x="1092" y="382">jobs, track results,</text>
  <text class="small" x="1102" y="406">saved remixes</text>

  <!-- domain services -->
  <path class="ink fill-blue" d="M1012 612 C1013 596 1028 587 1048 588 L1255 590 C1275 590 1288 601 1287 618 L1286 703 C1285 722 1270 731 1248 730 L1044 728 C1024 728 1012 716 1012 698 Z" />
  <text class="heading blue-text" x="1050" y="647">Metadata Agent</text>
  <text class="small" x="1045" y="676">provider evidence -> merge</text>
  <text class="small" x="1045" y="700">OpenAI synthesis + review notes</text>

  <path class="ink fill-purple" d="M1010 805 C1010 789 1024 780 1044 781 L1259 783 C1278 783 1289 795 1289 812 L1288 900 C1288 918 1274 928 1253 927 L1044 925 C1023 925 1010 913 1010 895 Z" />
  <text class="heading purple-text" x="1048" y="840">Remix Search</text>
  <text class="small" x="1044" y="870">query planner + providers</text>
  <text class="small" x="1044" y="894">OpenAI candidate ranking</text>

  <!-- storage diamond -->
  <path class="ink fill-white" d="M1168 90 L1260 170 L1168 250 L1076 170 Z" />
  <text class="heading" x="1126" y="178">Storage</text>
  <text class="small" x="1095" y="274">local SQLite file</text>

  <!-- providers -->
  <path class="ink fill-yellow" d="M1440 170 C1440 154 1456 146 1476 147 L1662 148 C1682 149 1694 160 1693 177 L1692 317 C1691 335 1676 344 1655 343 L1474 341 C1454 341 1441 329 1441 310 Z" />
  <text class="heading" x="1484" y="205">Metadata Providers</text>
  <text class="small" x="1481" y="236">Spotify</text>
  <text class="small" x="1481" y="262">GetSongBPM</text>
  <text class="small" x="1481" y="288">Beatport</text>
  <text class="small" x="1481" y="314">Wikipedia context</text>

  <path class="ink fill-yellow" d="M1440 410 C1441 394 1456 386 1476 387 L1662 388 C1682 389 1694 400 1693 417 L1692 550 C1691 568 1676 578 1655 577 L1475 575 C1455 575 1441 563 1441 545 Z" />
  <text class="heading" x="1495" y="445">Remix Providers</text>
  <text class="small" x="1481" y="476">Spotify remix search</text>
  <text class="small" x="1481" y="502">SoundCloud API</text>
  <text class="small" x="1481" y="528">SoundCloud web search</text>
  <text class="small" x="1481" y="554">SearXNG optional</text>

  <path class="ink purple fill-purple" d="M1450 655 C1450 639 1465 631 1485 632 L1665 633 C1686 634 1698 645 1697 662 L1696 795 C1695 813 1680 823 1658 822 L1484 820 C1464 820 1451 808 1451 790 Z" />
  <text class="heading purple-text" x="1516" y="690">AI Services</text>
  <text class="small" x="1488" y="724">OpenAI via LangChain</text>
  <text class="small" x="1488" y="752">metadata synthesis</text>
  <text class="small" x="1488" y="778">remix relevance ranking</text>

  <!-- database schema notes -->
  <text class="heading" x="1436" y="910">Tables</text>
  <rect class="ink thin fill-white" x="1440" y="934" width="115" height="72" />
  <path class="ink thin" d="M1469 934 L1469 1006 M1498 934 L1498 1006 M1527 934 L1527 1006 M1440 958 L1555 958 M1440 982 L1555 982" />
  <text class="small" x="1444" y="1030">track_analysis_jobs</text>

  <rect class="ink thin fill-white" x="1592" y="934" width="115" height="72" />
  <path class="ink thin" d="M1621 934 L1621 1006 M1650 934 L1650 1006 M1679 934 L1679 1006 M1592 958 L1707 958 M1592 982 L1707 982" />
  <text class="small" x="1607" y="1030">track_results</text>

  <rect class="ink thin fill-white" x="1288" y="934" width="115" height="72" />
  <path class="ink thin" d="M1317 934 L1317 1006 M1346 934 L1346 1006 M1375 934 L1375 1006 M1288 958 L1403 958 M1288 982 L1403 982" />
  <text class="small" x="1298" y="1030">saved_remixes</text>

  <!-- connections -->
  <path class="arrow" d="M540 282 C600 245 638 190 700 155" />
  <text class="small" x="552" y="240">POST /agent</text>
  <text class="small" x="552" y="263">POST /remix-search</text>

  <path class="arrow" d="M540 314 C603 320 632 315 682 313" />
  <text class="small" x="552" y="344">enqueue requests</text>

  <path class="arrow" d="M540 344 C612 420 632 485 678 488" />
  <text class="small" x="555" y="430">poll jobs</text>
  <text class="small" x="555" y="452">open results</text>

  <path class="arrow" d="M815 367 C820 428 822 515 824 630" />
  <text class="small" x="835" y="430">push to queue</text>

  <path class="arrow" d="M821 601 C821 578 822 560 824 548" />
  <text class="small" x="835" y="586">claim next job</text>

  <path class="arrow" d="M940 484 C970 510 990 585 1032 625" />
  <text class="small" x="949" y="550">analyze / enrich</text>

  <path class="arrow" d="M930 510 C965 642 980 776 1011 842" />
  <text class="small" x="926" y="745">remix_search</text>

  <path class="arrow" d="M1255 642 C1340 565 1378 298 1440 252" />
  <text class="small" x="1295" y="446">fetch provider evidence</text>

  <path class="arrow" d="M1255 862 C1340 840 1378 530 1440 493" />
  <text class="small" x="1295" y="720">search candidates</text>

  <path class="arrow-purple" d="M1258 676 C1345 675 1385 716 1450 725" />
  <text class="small purple-text" x="1310" y="660">AI synthesis</text>

  <path class="arrow-purple" d="M1260 885 C1352 890 1388 785 1450 775" />
  <text class="small purple-text" x="1314" y="910">AI ranking</text>

  <path class="arrow" d="M950 315 C985 305 1012 292 1042 278" />
  <text class="small" x="969" y="287">update queued</text>

  <path class="arrow" d="M940 690 C985 637 1014 560 1052 485" />
  <text class="small" x="945" y="612">complete / fail</text>

  <path class="arrow" d="M930 150 C995 150 1035 158 1076 169" />
  <text class="small" x="955" y="136">read/write data</text>

  <path class="arrow" d="M1168 250 C1172 255 1177 258 1188 260" />

  <path class="arrow" d="M1190 508 C1196 570 1198 690 1197 805" />
  <text class="small" x="1212" y="586">review artifact</text>
  <text class="small" x="1212" y="608">saved data</text>

  <path class="arrow-blue" d="M1040 430 C980 410 945 386 920 367" />
  <text class="small blue-text" x="944" y="402">result_json</text>

  <path class="arrow-blue" d="M1040 462 C972 482 948 515 930 545" />
