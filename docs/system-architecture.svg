  <!-- legend -->
  <text class="small" x="45" y="1015">Legend:</text>
  <path class="arrow" d="M115 1010 L190 1010" />
  <text class="small" x="205" y="1016">data / control flow</text>
  <path class="arrow-purple" d="M360 1010 L435 1010" />
  <text class="small purple-text" x="450" y="1016">AI flow</text>
  <path class="ink green fill-green" d="M590 993 L740 993 L756 1018 L606 1018 Z" />
  <text class="small green-text" x="610" y="1013">SQLite-backed queue</text>
</svg>
