name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  affected:
    name: Affected checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set affected refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NX_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "NX_BASE=origin/main" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
          echo "NX_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Run affected tests and typecheck
        run: yarn nx affected -t test,typecheck --base="$NX_BASE" --head="$NX_HEAD"
