<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TrackLab Icon</title>
  <desc id="desc">A lab flask containing an audio waveform with purple and blue gradient accents.</desc>
  <defs>
