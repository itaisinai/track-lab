services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: track_lab
      POSTGRES_USER: track_lab
      POSTGRES_PASSWORD: track_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_lab -d track_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATASTORE_PROVIDER: prisma
      DATABASE_URL: postgresql://track_lab:track_lab@postgres:5432/track_lab?schema=public
    command: ["yarn", "prisma:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATASTORE_PROVIDER: prisma
      DATABASE_URL: postgresql://track_lab:track_lab@postgres:5432/track_lab?schema=public
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      DATASTORE_PROVIDER: prisma
      DATABASE_URL: postgresql://track_lab:track_lab@postgres:5432/track_lab?schema=public
    volumes:
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    env_file:
      - ../.env
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
