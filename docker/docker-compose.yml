services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    depends_on:
      - api

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    env_file:
      - ../.env
    ports:
      - "5173:5173"
    depends_on:
      - api
