services:
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        DATABASE_URL: ${DATABASE_URL}
    env_file:
      - ../.env
    environment:
      DATASTORE_PROVIDER: prisma
      DATABASE_URL: ${DATABASE_URL}
    command: ["sh", "-lc", "yarn prisma:migrate:deploy"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        DATABASE_URL: ${DATABASE_URL}
    env_file:
      - ../.env
    environment:
      DATASTORE_PROVIDER: prisma
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        DATABASE_URL: ${DATABASE_URL}
    env_file:
      - ../.env
    environment:
      DATASTORE_PROVIDER: prisma
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped
